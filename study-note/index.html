<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0c0c">
  <meta name="description" content="Powered x Prayer 365 Days of Transformation study notes.">
  <link rel="icon" href="../images/icons/favicon-32x32.png">
  <link rel="stylesheet" href="./study-notes.css">
  <title>Study Notes | Powered x Prayer</title>
</head>
<body>
  <header class="study-header">
    <a class="study-brand" href="../" aria-label="Powered x Prayer home">
      <img src="https://assets.cdn.filesafe.space/CS4NGSgWYVqwkUR4I0Zh/media/6a7f17b4fe4291bd10b9961f.png" alt="">
      <span>Powered x Prayer</span>
    </a>
    <a class="home-link" href="../" aria-label="Return to home">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>
      Home
    </a>
  </header>

  <main class="study-page">
    <section class="study-hero" aria-labelledby="study-title">
      <p class="eyebrow">A year-long devotional archive</p>
      <h1 id="study-title">365 Days of R’s <span>Transformation</span></h1>
      <p>A curated collection of study notes organized by month. Open any month<br class="desktop-break"> to explore its weekly sessions and read the full notes.</p>
    </section>
    <section class="month-grid" id="month-grid" aria-label="Study notes by month"></section>
  </main>

  <dialog class="month-dialog" id="month-dialog" aria-labelledby="dialog-month-title">
    <div class="dialog-panel">
      <header class="dialog-header">
        <div>
          <p class="dialog-eyebrow">Study notes <span id="dialog-count"></span></p>
          <h2 id="dialog-month-title"></h2>
          <p id="dialog-series"></p>
        </div>
        <button class="dialog-close" type="button" aria-label="Close study notes">×</button>
      </header>
      <div class="dialog-body">
        <section class="session-section" aria-labelledby="session-heading">
          <h3 id="session-heading"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5A2.5 2.5 0 0 0 17.5 16H4Z"/><path d="M4 5.5V19a2 2 0 0 0 2 2h12"/></svg> Session videos</h3>
          <div class="session-grid" id="session-grid"></div>
        </section>
        <section class="note-section" aria-labelledby="note-heading">
          <h3 id="note-heading">Study notes</h3>
          <div class="note-grid" id="note-grid"></div>
        </section>
      </div>
    </div>
  </dialog>
  <dialog class="note-dialog" id="note-dialog" aria-labelledby="note-dialog-title"><div class="note-dialog-panel"><header class="note-dialog-header"><div><p class="dialog-eyebrow" id="note-dialog-date"></p><h2 id="note-dialog-title"></h2><p>Study note preview</p></div><button class="dialog-close" type="button" aria-label="Close study note preview">×</button></header><div class="note-preview-wrap"><iframe id="note-preview" title="Study note preview" loading="lazy"></iframe></div><a class="note-download" id="note-download" target="_blank" rel="noopener noreferrer">Print / Download</a></div></dialog>
  <script src="./study-notes.js"></script>
</body>
</html>
